<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>할리갈리 — 타자 대전</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ───────────── 접속 화면 ───────────── -->
<section class="screen" id="scLogin">
  <div class="panel">
    <h1 class="logo">🔔 할리갈리</h1>
    <p class="tag">종 대신 — 과일 이름을 <b>먼저 타자로 치는</b> 사람이 이깁니다</p>

    <label class="field">
      <span>닉네임</span>
      <input id="inName" maxlength="12" placeholder="이름을 입력하세요" autocomplete="nickname">
    </label>

    <button class="btn primary big" id="btnCreate">방 만들기</button>

    <div class="or"><span>또는</span></div>

    <div class="joinrow">
      <input id="inCode" maxlength="4" placeholder="방 코드" autocomplete="off"
             autocapitalize="characters" spellcheck="false">
      <button class="btn" id="btnJoin">참가</button>
    </div>

    <div class="themerow"><span>테마</span><select id="theme"><option value="felt">딥 그린 펠트</option><option value="neon">네온 아케이드</option><option value="paper">크래프트 페이퍼</option><option value="midnight">미드나잇 미니멀</option><option value="candy">캔디 팝</option></select></div>

    <p class="hint" id="loginHint">친구가 없어도 괜찮아요 — 방을 만든 뒤 <b>봇</b>을 넣으면 혼자서도 할 수 있습니다.</p>
  </div>
</section>

<!-- ───────────── 대기실 ───────────── -->
<section class="screen" id="scLobby" hidden>
  <div class="panel wide">
    <div class="codebox">
      <div>
        <div class="codelabel">방 코드</div>
        <div class="code" id="roomCode">----</div>
      </div>
      <button class="btn" id="btnCopy">링크 복사</button>
    </div>

    <div class="seatlist" id="lobbyPlayers"></div>

    <div class="hostonly" id="hostBox">
      <div class="opts">
        <label class="opt">
          <span>봇 실력</span>
          <select id="optDiff">
            <option value="easy">쉬움</option>
            <option value="normal" selected>보통</option>
            <option value="hard">어려움</option>
          </select>
        </label>
        <label class="opt">
          <span>자동 넘김</span>
          <select id="optLimit">
            <option value="4000">4초</option>
            <option value="6000" selected>6초</option>
            <option value="9000">9초</option>
            <option value="0">없음</option>
          </select>
        </label>
      </div>
      <div class="row">
        <button class="btn" id="btnAddBot">＋ 봇 추가</button>
        <button class="btn primary big" id="btnStart">게임 시작</button>
      </div>
    </div>
    <p class="hint" id="lobbyHint">방장이 시작하기를 기다리는 중…</p>
  </div>
</section>

<!-- ───────────── 게임 화면 ───────────── -->
<section class="screen game" id="scGame" hidden>
  <header class="bar">
    <span class="brand">🔔 할리갈리</span>
    <span class="pill" id="barCode">----</span>
    <span class="spacer"></span>
    <span class="pill" id="barTurn">—</span>
    <select id="themeGame" title="테마"><option value="felt">딥 그린 펠트</option><option value="neon">네온 아케이드</option><option value="paper">크래프트 페이퍼</option><option value="midnight">미드나잇 미니멀</option><option value="candy">캔디 팝</option></select>
    <button class="btn tiny" id="btnSound" title="소리 켜기/끄기" aria-label="소리">🔊</button>
    <button class="btn tiny" id="btnLeave">나가기</button>
  </header>

  <div class="verdict" id="verdict" hidden></div>

  <div class="table">
    <div class="board" id="board">
      <div class="bell" id="bell">🔔</div>
      <div class="slots" id="slots"></div>
    </div>

    <div class="tally" id="tally"></div>

    <div class="actionrow">
      <input id="entry" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="같은 과일 5개를 찾으면 이름을 치세요">
      <button class="btn flip" id="btnFlip"><b>카드 뒤집기</b><small>마우스로 클릭</small>
        <span class="timer" id="flipTimer"></span>
      </button>
    </div>

    <div class="status" id="status"></div>
    <div class="log" id="log"></div>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="panel">
      <div class="big" id="ovTitle"></div>
      <div class="sub" id="ovSub"></div>
      <div class="rank" id="ovRank"></div>
      <div class="row center">
        <button class="btn primary big" id="btnAgain">다시 하기</button>
        <button class="btn" id="btnToLobby">대기실로</button>
      </div>
    </div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
